name: Android CI

on:
  push:
    branches: ["main"]  # Trigger the workflow on pushes to the main branch
  pull_request:
    branches: ["main"]  # Trigger on pull requests to the main branch

jobs:
  build:
    runs-on: ubuntu-latest  # Use Ubuntu as the build environment

    steps:
    # Step 1: Checkout the code
    - uses: actions/checkout@v4  # Checkout the repository’s code

    # Step 2: Set up JDK 11
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'  # Use Temurin JDK distribution
        cache: gradle  # Cache Gradle dependencies

    # Step 3: Set up Android SDK
    - name: Set up Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip

        # Install Android SDK command-line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-6609375_latest.zip
        unzip commandlinetools-linux-6609375_latest.zip -d $ANDROID_HOME

        # Set ANDROID_HOME for environment
        echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV

        # Accept licenses
        yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-30" "build-tools;30.0.3"

    # Step 4: Grant execute permission for gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew  # Grant execute permission for Gradle wrapper

    # Step 5: Cache Gradle dependencies (Updated to v3)
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Step 6: Build with Gradle
    - name: Build with Gradle
      run: ./gradlew build --no-daemon  # Build the project (can add flags based on your needs)

    # Optional: Step 7: Run Unit Tests
    - name: Run Unit Tests
      run: ./gradlew test --no-daemon  # Run unit tests (optional)

    # Optional: Step 8: Build APK
    - name: Build APK
      run: ./gradlew assembleRelease --no-daemon  # Build release APK (optional)

